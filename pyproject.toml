[project]
name = "lotus"
version = "0.1.0"
description = "MicroPython firmware for the Lotus LED wall art (Raspberry Pi Pico W)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", {include-group = "server"}]
render = ["matplotlib>=3.8"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `stubs` shadows the MicroPython-only modules (machine, neopixel, network, uasyncio, ujson)
# so led.py and main.py import cleanly on desktop Python.
pythonpath = ["stubs", "."]
